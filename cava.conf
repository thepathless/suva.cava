[general]
bars = 24
framerate = 60
autosens = 1
sensitivity = 180

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 0.2
