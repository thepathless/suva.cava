[general]
bars = 24
framerate = 60
autosens = 1
sensitivity = 180

[input]
method = pipewire
# Listen to the speaker sink's monitor (system audio), NOT the default
# source — "auto" would grab the microphone (e.g. the Bluetooth headset mic).
source = alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink.monitor

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 0.2
